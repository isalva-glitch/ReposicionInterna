<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" fill="none">
  <rect width="1080" height="1920" fill="#E0FFF5" />

  <!-- Header -->
  <rect x="40" y="40" width="1000" height="120" rx="24" fill="#FFFFFF" stroke="#C2DAD1" stroke-width="3" />
  <text x="80" y="98" font-family="'DejaVu Sans', sans-serif" font-size="40" font-weight="700" fill="#0B3B2B">Fontela Cristales</text>
  <text x="80" y="140" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#2C604C">Reposición interna</text>
  <rect x="820" y="70" width="160" height="60" rx="12" fill="#F4F8F6" stroke="#2C604C" stroke-width="3" />
  <text x="875" y="110" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#2C604C">Salir</text>

  <!-- Main action buttons -->
  <rect x="40" y="180" width="480" height="70" rx="14" fill="#0B8D60" />
  <text x="120" y="225" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#FFFFFF">Nuevo pedido</text>
  <rect x="560" y="180" width="480" height="70" rx="14" fill="#FFFFFF" stroke="#0B8D60" stroke-width="4" />
  <text x="670" y="225" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#0B8D60">Ver registros</text>

  <!-- Datos generales -->
  <rect x="40" y="280" width="1000" height="430" rx="26" fill="#FFFFFF" stroke="#DFE9E5" stroke-width="3" />
  <text x="80" y="330" font-family="'DejaVu Sans', sans-serif" font-size="34" font-weight="700" fill="#0B3B2B">Datos generales</text>
  <rect x="80" y="360" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="90" y="390" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">Fecha</text>
  <text x="90" y="425" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#6B6B6B">dd/MM/yyyy</text>
  <rect x="560" y="360" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="570" y="390" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">N° de pedido</text>
  <text x="570" y="425" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#6B6B6B">Ej: 245</text>
  <rect x="80" y="470" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="90" y="500" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">Responsable</text>
  <text x="90" y="535" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#6B6B6B">Claudia</text>
  <rect x="560" y="470" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="570" y="500" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">Sector</text>
  <text x="570" y="535" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#6B6B6B">Corte</text>
  <rect x="80" y="580" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="90" y="610" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">Material</text>
  <text x="90" y="645" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#6B6B6B">Float 4mm</text>
  <rect x="560" y="580" width="420" height="90" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="570" y="610" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">Dimensiones</text>
  <text x="570" y="645" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#6B6B6B">ALTO x ANCHO</text>

  <!-- Procesos y motivo -->
  <rect x="40" y="730" width="1000" height="630" rx="26" fill="#FFFFFF" stroke="#DFE9E5" stroke-width="3" />
  <text x="80" y="780" font-family="'DejaVu Sans', sans-serif" font-size="32" font-weight="700" fill="#0B3B2B">Procesos por vidrio</text>
  <rect x="80" y="810" width="420" height="80" rx="12" fill="#F3F8F6" stroke="#D5E4DD" stroke-width="2" />
  <text x="100" y="860" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#0B3B2B">Vidrio 1 — Pulido / Templado</text>
  <rect x="80" y="900" width="420" height="120" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="100" y="940" font-family="'DejaVu Sans', sans-serif" font-size="20" fill="#6B6B6B">Detalle cara 1</text>
  <rect x="560" y="810" width="420" height="80" rx="12" fill="#F3F8F6" stroke="#D5E4DD" stroke-width="2" />
  <text x="580" y="860" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#0B3B2B">Vidrio 2 — Pulido / Templado</text>
  <rect x="560" y="900" width="420" height="120" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="580" y="940" font-family="'DejaVu Sans', sans-serif" font-size="20" fill="#6B6B6B">Detalle cara 2</text>
  <rect x="80" y="1040" width="240" height="50" rx="12" fill="#FFFFFF" stroke="#0B8D60" stroke-width="2" />
  <text x="110" y="1075" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#0B8D60">Ya es DVH</text>
  <text x="80" y="1120" font-family="'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#0B3B2B">Origen del corte</text>
  <text x="90" y="1155" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#0B3B2B">● Cortar de Float   ○ Cortar de Laminado</text>
  <text x="80" y="1200" font-family="'DejaVu Sans', sans-serif" font-size="24" font-weight="700" fill="#0B3B2B">Motivo</text>
  <rect x="80" y="1220" width="900" height="110" rx="12" fill="#FFFFFF" stroke="#D5E4DD" stroke-width="2" />
  <text x="100" y="1270" font-family="'DejaVu Sans', sans-serif" font-size="20" fill="#6B6B6B">Descripción del motivo</text>

  <!-- Resumen preview -->
  <rect x="40" y="1380" width="1000" height="200" rx="24" fill="#FFFFFF" stroke="#DFE9E5" stroke-width="3" />
  <text x="80" y="1430" font-family="'DejaVu Sans', sans-serif" font-size="30" font-weight="700" fill="#0B3B2B">Vista previa</text>
  <text x="80" y="1470" font-family="'DejaVu Sans', sans-serif" font-size="22" fill="#2C604C">Resumen con material, procesos y origen del corte listo para generar PDF.</text>

  <!-- Final buttons -->
  <rect x="40" y="1610" width="480" height="80" rx="16" fill="#0B8D60" />
  <text x="150" y="1660" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#FFFFFF">Vista previa</text>
  <rect x="560" y="1610" width="480" height="80" rx="16" fill="#FFFFFF" stroke="#0B8D60" stroke-width="4" />
  <text x="640" y="1660" font-family="'DejaVu Sans', sans-serif" font-size="26" fill="#0B8D60">Guardar y enviar</text>
</svg>
