<svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg" style="background:#e0fff5;font-family:'DejaVu Sans', Arial, sans-serif;">
  <style>
    .title { font-size:48px; font-weight:bold; fill:#123; }
    .subtitle { font-size:32px; fill:#234; }
    .label { font-size:28px; fill:#234; }
    .button { font-size:30px; font-weight:bold; }
  </style>
  <!-- Header -->
  <text x="30" y="80" class="title">Fontela Cristales</text>
  <text x="30" y="130" class="subtitle">Gestión de Reposiciones</text>
  <rect x="820" y="30" width="230" height="70" fill="none" stroke="#0b7d6e" stroke-width="3" rx="8" />
  <text x="880" y="77" class="button" fill="#0b7d6e">Salir</text>

  <!-- Datos generales -->
  <text x="30" y="210" class="title">Datos generales</text>
  <g transform="translate(0,210)">
    <g transform="translate(0,40)">
      <text x="30" y="30" class="label">Fecha (dd/MM/yyyy)</text>
      <rect x="30" y="50" width="1020" height="60" fill="#fff" stroke="#555" stroke-width="2" rx="8"/>
    </g>
    <g transform="translate(0,150)">
      <text x="30" y="30" class="label">N° de pedido</text>
      <rect x="30" y="50" width="1020" height="60" fill="#fff" stroke="#555" stroke-width="2" rx="8"/>
    </g>
    <g transform="translate(0,260)">
      <text x="30" y="30" class="label">Responsable</text>
      <rect x="30" y="50" width="1020" height="60" fill="#fff" stroke="#555" stroke-width="2" rx="8"/>
    </g>
    <g transform="translate(0,370)">
      <text x="30" y="30" class="label">Sector</text>
      <rect x="30" y="50" width="1020" height="60" fill="#fff" stroke="#555" stroke-width="2" rx="8"/>
    </g>
    <g transform="translate(0,480)">
      <text x="30" y="30" class="label">Material</text>
      <rect x="30" y="50" width="1020" height="60" fill="#fff" stroke="#555" stroke-width="2" rx="8"/>
    </g>
  </g>

  <!-- Procesos por cara -->
  <text x="30" y="950" class="title">Procesos requeridos por cara</text>
  <g transform="translate(0,960)">
    <g transform="translate(0,30)">
      <text x="30" y="30" class="label">Cara 1</text>
      <rect x="230" y="4" width="32" height="32" fill="none" stroke="#0b7d6e" stroke-width="3"/>
      <text x="270" y="30" class="label" fill="#0b7d6e">Pulido</text>
      <rect x="510" y="4" width="32" height="32" fill="none" stroke="#0b7d6e" stroke-width="3"/>
      <text x="550" y="30" class="label" fill="#0b7d6e">Templado</text>
      <rect x="30" y="60" width="1020" height="120" fill="#fff" stroke="#999" stroke-width="2" rx="12"/>
    </g>
    <g transform="translate(0,230)">
      <text x="30" y="30" class="label">Cara 2</text>
      <rect x="230" y="4" width="32" height="32" fill="none" stroke="#0b7d6e" stroke-width="3"/>
      <text x="270" y="30" class="label" fill="#0b7d6e">Pulido</text>
      <rect x="510" y="4" width="32" height="32" fill="none" stroke="#0b7d6e" stroke-width="3"/>
      <text x="550" y="30" class="label" fill="#0b7d6e">Templado</text>
      <rect x="30" y="60" width="1020" height="120" fill="#fff" stroke="#999" stroke-width="2" rx="12"/>
    </g>
  </g>

  <!-- Motivo -->
  <g transform="translate(0,1340)">
    <text x="30" y="30" class="label">Motivo</text>
    <rect x="30" y="50" width="1020" height="120" fill="#fff" stroke="#999" stroke-width="2" rx="12"/>
  </g>

  <!-- Otros procesos -->
  <g transform="translate(0,1500)">
    <text x="30" y="30" class="title">Otros procesos</text>
    <rect x="30" y="50" width="40" height="40" fill="none" stroke="#0b7d6e" stroke-width="3"/>
    <text x="80" y="80" class="label" fill="#0b7d6e">Ya es DVH</text>
  </g>

  <!-- Origen del corte -->
  <g transform="translate(0,1610)">
    <text x="30" y="30" class="title">Origen del corte</text>
    <circle cx="50" cy="80" r="20" fill="none" stroke="#0b7d6e" stroke-width="3"/>
    <text x="90" y="90" class="label">Cortar de Float</text>
    <circle cx="50" cy="150" r="20" fill="none" stroke="#0b7d6e" stroke-width="3"/>
    <text x="90" y="160" class="label">Cortar de Laminado</text>
  </g>

  <!-- Vista previa -->
  <g transform="translate(0,1760)">
    <rect x="30" y="0" width="1020" height="200" fill="#f8fffd" stroke="#0b7d6e" stroke-width="3" rx="16"/>
    <text x="50" y="50" class="title" fill="#0b7d6e">Vista previa</text>
    <text x="50" y="110" class="label" fill="#234">Resumen del pedido&#10;Cara 1: Pulido y templado&#10;Cara 2: Pulido</text>
  </g>

  <!-- Botones -->
  <g transform="translate(0,1980)">
    <rect x="30" y="0" width="500" height="70" fill="#fff" stroke="#0b7d6e" stroke-width="3" rx="12"/>
    <text x="80" y="46" class="button" fill="#0b7d6e">Vista previa</text>
    <rect x="550" y="0" width="500" height="70" fill="#0b7d6e" stroke="#0b7d6e" stroke-width="3" rx="12"/>
    <text x="620" y="46" class="button" fill="#fff">Guardar y enviar</text>
  </g>
</svg>